[build]
  publish = "."
  command = ""

# Security headers for the whole site. The page is a single static document
# with four inline <script> blocks and inline styles, so script/style need
# 'unsafe-inline'; everything else is locked to same-origin plus the Google
# Fonts stylesheet/hosts the page already pulls. Netlify's RUM beacon is
# same-origin (/.netlify/scripts/rum), so 'self' covers it.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), serial=()"
