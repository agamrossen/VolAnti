# Python environment for the firmware build and the host tools.
#
#   conda env create -f environment.yml
#
# The build prefers this environment by name, but it does not require it, and
# it does not require conda: any Python 3 with numpy will do, and SENTRY_PYTHON
# names one outright. The rest of this list is for the host tools in src/ and
# firmware/sentry_node/scripts/. See docs/flashing.md.
name: acoustic-detector
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4
  - scipy
  - matplotlib
  - pyserial
  - pysoundfile
